<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" style="background:#090d16; border-radius:18px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="40%" stop-color="#0c1324"/>
      <stop offset="80%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <!-- Neon Wave Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="22" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.35"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    @keyframes waveMove1 {
      0% { transform: translateX(0px) translateY(0px); }
      50% { transform: translateX(-30px) translateY(6px); }
      100% { transform: translateX(0px) translateY(0px); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(0px) translateY(0px); }
      50% { transform: translateX(35px) translateY(-8px); }
      100% { transform: translateX(0px) translateY(0px); }
    }
    @keyframes pulseLight {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.95; transform: scale(1.3); }
    }
    @keyframes badgeBorder {
      0%, 100% { stroke: #38bdf8; }
      50% { stroke: #c084fc; }
    }
    .wave1 { animation: waveMove1 12s ease-in-out infinite; }
    .wave2 { animation: waveMove2 15s ease-in-out infinite; }
    .star1 { animation: starTwinkle 3s ease-in-out infinite; }
    .star2 { animation: starTwinkle 4s ease-in-out infinite 1.5s; }
    .star3 { animation: starTwinkle 3.5s ease-in-out infinite 0.7s; }
    .pulsing-dot { animation: pulseLight 2s ease-in-out infinite; transform-origin: center; }
    .badge-box { animation: badgeBorder 4s linear infinite; }
    
    .tech-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #94a3b8;
      transition: all 0.3s ease;
    }
    .tech-pill:hover {
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>

  <!-- Perspective Ambient Grid -->
  <rect width="1200" height="380" fill="url(#grid)" opacity="0.6"/>

  <!-- Radial Glow Behind Title -->
  <circle cx="600" cy="180" r="280" fill="#38bdf8" opacity="0.08" filter="url(#glowCyan)"/>
  <circle cx="600" cy="190" r="220" fill="#a855f7" opacity="0.07" filter="url(#glowPurple)"/>

  <!-- Top Cyber Corner Accents -->
  <path d="M 30 50 L 30 30 L 50 30" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 1170 50 L 1170 30 L 1150 30" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 30 330 L 30 350 L 50 350" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 1170 330 L 1170 350 L 1150 350" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Glowing Animated Stars / Cyber Nodes -->
  <circle class="star1" cx="180" cy="80" r="2.5" fill="#38bdf8"/>
  <circle class="star2" cx="320" cy="120" r="2" fill="#c084fc"/>
  <circle class="star3" cx="1020" cy="90" r="2.5" fill="#38bdf8"/>
  <circle class="star1" cx="880" cy="130" r="2" fill="#818cf8"/>
  <circle class="star2" cx="140" cy="270" r="2" fill="#38bdf8"/>
  <circle class="star3" cx="1060" cy="260" r="2.5" fill="#a855f7"/>

  <!-- Top Status Badge: Available for Opportunities -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" opacity="0.95"/>
    <!-- Pulsing Green Dot -->
    <circle class="pulsing-dot" cx="-110" cy="0" r="5" fill="#10b981"/>
    <circle cx="-110" cy="0" r="10" fill="#10b981" opacity="0.25"/>
    <text x="5" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" fill="#38bdf8">
      AVAILABLE FOR WORK &amp; ROLES
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="900" letter-spacing="5" fill="url(#textGrad)" filter="url(#textGlow)">
    SHUBHAM
  </text>

  <!-- Tagline / Subtitle -->
  <text x="600" y="208" text-anchor="middle" font-family="'Fira Code', -apple-system, monospace" font-size="17" font-weight="600" letter-spacing="4.5" fill="#94a3b8">
    FULL STACK WEB DEVELOPER
  </text>

  <!-- Dynamic Tech Stack Badges Row Inside Banner -->
  <g transform="translate(600, 256)">
    <!-- Pill 1: MERN & Next.js -->
    <g transform="translate(-255, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <text class="tech-pill" x="0" y="5" text-anchor="middle">⚡ MERN &amp; NextJs</text>
    </g>

    <!-- Pill 2: TypeScript & React -->
    <g transform="translate(-85, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <text class="tech-pill" x="0" y="5" text-anchor="middle">🔷 TypeScript &amp; NestJS</text>
    </g>

    <!-- Pill 3: Scalable Backend & DB -->
    <g transform="translate(90, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="url(#badgeGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6"/>
      <text class="tech-pill" x="0" y="5" text-anchor="middle">🚀 SQL &amp; MongoDB</text>
    </g>

    <!-- Pill 4: Clean UI / UX -->
    <g transform="translate(255, 0)">
      <rect x="-70" y="-15" width="180" height="30" rx="15" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <text class="tech-pill" x="0" y="5" text-anchor="middle">💎 Clean UI &amp; Real-time</text>
    </g>
  </g>

  <!-- Flowing Neon Wave Curves at the Bottom -->
  <g opacity="0.85">
    <!-- Neon Wave 2 (Purple glow behind) -->
    <path class="wave2" d="M -100 340 C 200 300, 450 365, 750 320 C 1000 280, 1150 345, 1350 315 L 1350 390 L -100 390 Z" fill="url(#neonPurple)" opacity="0.35" filter="url(#glowPurple)"/>
    <path class="wave2" d="M -100 340 C 200 300, 450 365, 750 320 C 1000 280, 1150 345, 1350 315" stroke="url(#neonPurple)" stroke-width="3" fill="none" opacity="0.8"/>

    <!-- Neon Wave 1 (Cyan glow front) -->
    <path class="wave1" d="M -100 350 C 180 370, 420 310, 680 345 C 920 380, 1100 310, 1350 340 L 1350 390 L -100 390 Z" fill="url(#neonCyan)" opacity="0.25" filter="url(#glowCyan)"/>
    <path class="wave1" d="M -100 350 C 180 370, 420 310, 680 345 C 920 380, 1100 310, 1350 340" stroke="url(#neonCyan)" stroke-width="2.5" fill="none" opacity="0.95"/>
  </g>

  <!-- Subtle Bottom Cyber Accent Line -->
  <line x1="200" y1="375" x2="1000" y2="375" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="375" r="3" fill="#38bdf8" opacity="0.8"/>
</svg>
